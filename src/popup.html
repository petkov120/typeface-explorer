<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=320" />
    <title>Typeface Explorer</title>
    <style>
      :root {
        --ink: #fff8ff;
        --mute: #b9a9c4;
        --line: rgba(238, 217, 255, 0.16);
        --hot: #ff4fa3;
        --sun: #ff9b4a;
        --violet: #9b5cff;
        --panel: #16051f;
        --panel-2: #21092d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 300px;
        background:
          radial-gradient(circle at 18% -8%, rgba(255, 155, 74, 0.22), transparent 38%),
          radial-gradient(circle at 94% 22%, rgba(155, 92, 255, 0.24), transparent 42%),
          linear-gradient(145deg, #20072b 0%, var(--panel) 52%, #100318 100%);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }

      body {
        position: relative;
        padding: 16px 16px 14px;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.18;
        mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        flex: 0 0 auto;
        border-radius: 9px;
        box-shadow: 0 0 22px rgba(194, 89, 255, 0.28);
      }

      .mark {
        font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 1.1;
        background: linear-gradient(100deg, #fff7d8 0%, #ff9b4a 34%, #ff4fa3 68%, #c69cff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .lede {
        margin-top: 6px;
        color: var(--mute);
        font-size: 12px;
        line-height: 1.45;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 12px;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mute);
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4a433c;
      }

      .dot.on {
        background: var(--hot);
        box-shadow: 0 0 0 3px rgba(255, 79, 163, 0.13), 0 0 12px rgba(255, 79, 163, 0.75);
      }

      .enable {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 10px;
        background: linear-gradient(105deg, var(--sun), var(--hot) 55%, var(--violet));
        color: #24081e;
        font: inherit;
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(255, 79, 163, 0.22), inset 0 1px rgba(255, 255, 255, 0.34);
        transition: transform 140ms ease, filter 140ms ease;
      }

      .enable:hover {
        filter: brightness(1.1) saturate(1.08);
        transform: translateY(-1px);
      }

      .enable.on {
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .ghost {
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.035);
        color: var(--ink);
        font: inherit;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .ghost:hover {
        border-color: rgba(255, 105, 190, 0.48);
        background: rgba(255, 79, 163, 0.08);
      }

      .ghost:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .hint {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--mute);
        font-size: 11px;
      }

      .msg {
        margin-top: 10px;
        min-height: 16px;
        font-size: 11px;
        color: #ff8bc4;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img class="brand-icon" src="../icons/icon48.png" alt="" />
      <div class="mark">Typeface Explorer</div>
    </div>
    <p class="lede">Try faces and pairings on the live page. Nothing writes to your repo.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="state">Picker off</span></div>
    <button type="button" class="enable" id="enable">Enable picker</button>
    <div class="row">
      <button type="button" class="ghost" id="copy">Copy CSS</button>
      <button type="button" class="ghost" id="reset">Reset</button>
    </div>
    <p class="hint">Click text to open the studio. Hover a face to preview. Esc drops an uncommitted look.</p>
    <p class="msg" id="msg"></p>
    <script src="popup.js"></script>
  </body>
</html>
